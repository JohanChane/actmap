[actions.install]
description = "安装软件包"
args = [
    "pkgs",
]

[actions.install.pacman]
cmd_format = "pacman -S {pkgs}"

[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.install.dnf]
cmd_format = "dnf install {pkgs}"

[actions.remove]
description = "卸载软件包"
args = [
    "pkgs",
]

[actions.remove.pacman]
cmd_format = "pacman -R {pkgs}"

[actions.remove.apt]
cmd_format = "apt remove {pkgs}"

[actions.remove.dnf]
cmd_format = "dnf remove {pkgs}"

[actions.search]
description = "搜索软件包"
args = [
    "pkgs",
]

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.search.dnf]
cmd_format = "dnf search {pkgs}"

[actions.update]
description = "更新软件包数据库"
args = []

[actions.update.pacman]
cmd_format = "pacman -Sy"

[actions.update.apt]
cmd_format = "apt update"

[actions.update.dnf]
cmd_format = "dnf check-update"

[actions.upgrade]
description = "升级所有软件包"
args = []

[actions.upgrade.pacman]
cmd_format = "pacman -Syu"

[actions.upgrade.apt]
cmd_format = "apt upgrade"

[actions.upgrade.dnf]
cmd_format = "dnf upgrade"

[actions.force_update]
description = "强制更新软件包数据库"
args = []

[actions.force_update.pacman]
cmd_format = "pacman -Syy"

[actions.force_update.apt]
cmd_format = "apt update --refresh-all"

[actions.force_update.dnf]
cmd_format = "dnf clean all && dnf check-update"

[actions.force_upgrade]
description = "强制刷新并升级系统"
args = []

[actions.force_upgrade.pacman]
cmd_format = "pacman -Syyu"

[actions.force_upgrade.apt]
cmd_format = "apt update --refresh-all && apt upgrade"

[actions.force_upgrade.dnf]
cmd_format = "dnf clean all && dnf upgrade"

[actions.info]
description = "显示软件包信息"
args = [
    "pkgs",
]

[actions.info.pacman]
cmd_format = "pacman -Si {pkgs}"

[actions.info.apt]
cmd_format = "apt show {pkgs}"

[actions.info.dnf]
cmd_format = "dnf info {pkgs}"

[actions.list_installed]
description = "列出已安装的软件包"
args = []

[actions.list_installed.pacman]
cmd_format = "pacman -Q"

[actions.list_installed.apt]
cmd_format = "apt list --installed"

[actions.list_installed.dnf]
cmd_format = "dnf list installed"

[actions.clean]
description = "清理缓存"
args = []

[actions.clean.pacman]
cmd_format = "pacman -Sc"

[actions.clean.apt]
cmd_format = "apt autoclean"

[actions.clean.dnf]
cmd_format = "dnf clean all"

[actions.help]
description = "显示帮助信息"
args = []

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.help.apt]
cmd_format = "apt --help"

[actions.help.dnf]
cmd_format = "dnf --help"

[action_interfaces.pacman.args]
arg_parser = "getopt"

[[action_interfaces.pacman.args.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

[[action_interfaces.pacman.args.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.pacman.args.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true
sub_args = [
    { name = "s", short_opt = "-s", arg = "search_flag", is_flag = true },
    { name = "y", short_opt = "-y", arg = "refresh", is_flag = true, is_repeatable = true },
    { name = "u", short_opt = "-u", arg = "upgrade_flag", is_flag = true },
    { name = "i", short_opt = "-i", arg = "info_flag", is_flag = true },
    { name = "c", short_opt = "-c", arg = "clean_flag", is_flag = true },
]

[[action_interfaces.pacman.args.arg_parse]]
name = "R"
short_opt = "-R"
is_flag = true

[[action_interfaces.pacman.args.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true
sub_args = [
    { name = "s", short_opt = "-s", arg = "query_search_flag", is_flag = true },
]

[[action_interfaces.pacman.triggers.rules]]
name = "help_operations"
trigger = [
    { params = [], action = "help" },
]

[action_interfaces.pacman.triggers.rules.condition]
params = [
    { name = "help" },
]

[[action_interfaces.pacman.triggers.rules]]
name = "sync_operations"

[action_interfaces.pacman.triggers.rules.condition]
params = [
    { name = "S" },
]

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "y", repeat = 2 },
    { name = "u" },
]
action = "force_upgrade"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "y", repeat = 2 },
]
action = "force_update"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "y" },
    { name = "u" },
]
action = "upgrade"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "y" },
]
action = "update"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "s" },
]
action = "search"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "i" },
]
action = "info"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "c" },
]
action = "clean"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = []
action = "install"

[[action_interfaces.pacman.triggers.rules]]
name = "remove_operations"
trigger = [
    { params = [], action = "remove" },
]

[action_interfaces.pacman.triggers.rules.condition]
params = [
    { name = "R" },
]

[[action_interfaces.pacman.triggers.rules]]
name = "query_operations"

[action_interfaces.pacman.triggers.rules.condition]
params = [
    { name = "Q" },
]

[[action_interfaces.pacman.triggers.rules.trigger]]
params = [
    { name = "s" },
]
action = "search"

[[action_interfaces.pacman.triggers.rules.trigger]]
params = []
action = "list_installed"

[[action_interfaces.pacman.triggers.rules]]
name = "no_arg"
trigger = [
    { params = [], action = "install" },
]

[action_interfaces.pacman.triggers.rules.condition]
params = []

