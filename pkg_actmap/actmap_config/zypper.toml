# Zypper 包管理器配置

# === Zypper 命令实现 ===
[actions.install.zypper]
cmd_format = "zypper install {pkgs}"

[actions.remove.zypper]
cmd_format = "zypper remove {pkgs}"

[actions.search.zypper]
cmd_format = "zypper search {pkgs}"

[actions.update.zypper]
cmd_format = "zypper refresh"

[actions.upgrade.zypper]
cmd_format = "zypper update"

[actions.force_update.zypper]
cmd_format = "zypper refresh --force"

[actions.force_upgrade.zypper]
cmd_format = "zypper dist-upgrade"

[actions.info.zypper]
cmd_format = "zypper info {pkgs}"

[actions.list_installed.zypper]
cmd_format = "zypper search --installed-only"

[actions.clean.zypper]
cmd_format = "zypper clean"

[actions.help.zypper]
cmd_format = "zypper --help"

[actions.list_files.zypper]
cmd_format = "rpm -ql {pkgs}"

[actions.find_file_owner.zypper]
cmd_format = "rpm -qf {files}"

[actions.find_file_owner_remote.zypper]
cmd_format = "zypper what-provides {files}"

[actions.download_source.zypper]
cmd_format = "zypper source-install {pkgs}"

# === Zypper 参数解析 ===
[action_interfaces.zypper.args.zypper_command]
cmd_name = "zypper"
arg_parser = "argparse"

# Zypper 全局帮助参数
[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# Zypper 子命令
[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "remove"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.zypper.args.zypper_command.arg_parse.sub_args]]
name = "installed_only"
long_opt = "--installed-only"
arg = "installed_only_flag"
is_flag = true

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "refresh"
is_sub_cmd = true

[[action_interfaces.zypper.args.zypper_command.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "dist-upgrade"
is_sub_cmd = true

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "clean"
is_sub_cmd = true

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "what-provides"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.zypper.args.zypper_command.arg_parse]]
name = "source-install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === Zypper 动作触发规则 ===
[action_interfaces.zypper.triggers.zypper_command]
cmd_name = "zypper"

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "remove_operations"
condition = { params = [{ name = "remove", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "installed_only" }], action = "list_installed" },
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "update_operations"
condition = { params = [{ name = "refresh", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "upgrade" }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "force_upgrade_operations"
condition = { params = [{ name = "dist-upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "force_upgrade" }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "clean_operations"
condition = { params = [{ name = "clean", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "find_file_owner_remote_operations"
condition = { params = [{ name = "what-provides", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "download_source_operations"
condition = { params = [{ name = "source-install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "download_source", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.zypper.triggers.zypper_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]