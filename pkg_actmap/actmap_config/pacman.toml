# Pacman Package Manager Configuration

# === Pacman Command Implementation ===
[actions.install.pacman]
cmd_format = "pacman -S {pkgs}"

[actions.remove.pacman]
cmd_format = "pacman -R {pkgs}"

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.update.pacman]
cmd_format = "pacman -Sy"

[actions.upgrade.pacman]
cmd_format = "pacman -Syu"

[actions.force_update.pacman]
cmd_format = "pacman -Syy"

[actions.force_upgrade.pacman]
cmd_format = "pacman -Syyu"

[actions.info.pacman]
cmd_format = "pacman -Si {pkgs}"

[actions.list_installed.pacman]
cmd_format = "pacman -Q"

[actions.clean.pacman]
cmd_format = "pacman -Sc"

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.list_files.pacman]
cmd_format = "pacman -Ql {pkgs}"

[actions.find_file_owner.pacman]
cmd_format = "pacman -Qo {files}"

[actions.find_file_owner_remote.pacman]
cmd_format = "pacman -F {files}"

[actions.download_source.pacman]
cmd_format = "asp export {pkgs}"

# === Pacman Parameter Parsing ===
[action_interfaces.pacman.args.pacman_command]
cmd_name = "pacman"
arg_parser = "getopt"

# Global parameter -h
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

# Use unified targets parameter name
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "y"
short_opt = "-y"
arg = "refresh"
is_flag = true
is_repeatable = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "u"
short_opt = "-u"
arg = "upgrade_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "i"
short_opt = "-i"
arg = "info_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "c"
short_opt = "-c"
arg = "clean_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "R"
short_opt = "-R"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "query_search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "l"
short_opt = "-l"
arg = "list_files_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "o"
short_opt = "-o"
arg = "find_file_owner_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "F"
short_opt = "-F"
is_flag = true

# === Pacman Action Trigger Rules ===
[action_interfaces.pacman.triggers.pacman_command]
cmd_name = "pacman"

# Global help trigger rule
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# Sync operation group (-S related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    { params = [{ name = "y", repeat = 2 }, { name = "u" }], action = "force_upgrade" },
    { params = [{ name = "y", repeat = 2 }], action = "force_update" },
    { params = [{ name = "y" }, { name = "u" }], action = "upgrade" },
    { params = [{ name = "y" }], action = "update" },
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [{ name = "i" }], action = "info", arg_map = { targets = "pkgs" } },
    { params = [{ name = "c" }], action = "clean" },
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

# Remove operation group (-R related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "remove_operations"
condition = { params = [{ name = "R" }] }
trigger = [
    { params = [], action = "remove", arg_map = { targets = "pkgs" } }
]

# Query operation group (-Q related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "query_operations"
condition = { params = [{ name = "Q" }] }
trigger = [
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [{ name = "l" }], action = "list_files", arg_map = { targets = "pkgs" } },
    { params = [{ name = "o" }], action = "find_file_owner", arg_map = { targets = "files" } },
    { params = [], action = "list_installed" }
]

# File search operation group (-F related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "find_file_remote_operations"
condition = { params = [{ name = "F" }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]

# Default operation when no parameters specified
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "no_arg"
condition = { params = [] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

# === ASP Parameter Parsing ===
[action_interfaces.pacman.args.asp_command]
cmd_name = "asp"
arg_parser = "argparse"

# ASP subcommands
[[action_interfaces.pacman.args.asp_command.arg_parse]]
name = "export"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === ASP Action Trigger Rules ===
[action_interfaces.pacman.triggers.asp_command]
cmd_name = "asp"

[[action_interfaces.pacman.triggers.asp_command.rules]]
name = "download_source_operations"
condition = { params = [{ name = "export", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "download_source", arg_map = { targets = "pkgs" } }
]