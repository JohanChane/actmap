# Scoop 包管理器配置 (Windows)

[actions.install.scoop]
cmd_format = "scoop install {pkgs}"

[actions.remove.scoop]
cmd_format = "scoop uninstall {pkgs}"

[actions.search.scoop]
cmd_format = "scoop search {pkgs}"

[actions.update.scoop]
cmd_format = "scoop update"  # 更新 scoop 自身和所有包

[actions.upgrade.scoop]
cmd_format = "scoop update *"  # 升级所有包

[actions.force_update.scoop]
cmd_format = "scoop update --force"

[actions.force_upgrade.scoop]
cmd_format = "scoop update * --force"

[actions.info.scoop]
cmd_format = "scoop info {pkgs}"

[actions.list_installed.scoop]
cmd_format = "scoop list"

[actions.clean.scoop]
cmd_format = "scoop cache rm *"  # 清理缓存

[actions.help.scoop]
cmd_format = "scoop --help"

[action_interfaces.scoop.args]
arg_parser = "argparse"

[[action_interfaces.scoop.args.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

[[action_interfaces.scoop.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.scoop.args.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.scoop.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.scoop.args.arg_parse]]
name = "update"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.scoop.args.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.scoop.args.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.scoop.args.arg_parse]]
name = "list"
is_sub_cmd = true

[[action_interfaces.scoop.args.arg_parse]]
name = "cache"
is_sub_cmd = true

[[action_interfaces.scoop.args.arg_parse.sub_args]]
name = "rm"
long_opt = "rm"
arg = "cache_rm"
is_flag = true

[action_interfaces.scoop.triggers]

[[action_interfaces.scoop.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [{ params = [], action = "install" }]

[[action_interfaces.scoop.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [{ params = [], action = "remove" }]

[[action_interfaces.scoop.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [{ params = [], action = "search" }]

[[action_interfaces.scoop.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.scoop.triggers.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [{ params = [], action = "info" }]

[[action_interfaces.scoop.triggers.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [{ params = [], action = "list_installed" }]

[[action_interfaces.scoop.triggers.rules]]
name = "clean_operations"
condition = { params = [{ name = "cache", is_sub_cmd = true }] }
trigger = [{ params = [{ name = "rm" }], action = "clean" }]

[[action_interfaces.scoop.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [{ params = [], action = "help" }]