# Scoop Package Manager Configuration

# === Scoop Command Implementation ===
[actions.install.scoop]
cmd_format = "scoop install {pkgs}"

[actions.remove.scoop]
cmd_format = "scoop uninstall {pkgs}"

[actions.search.scoop]
cmd_format = "scoop search {pkgs}"

[actions.update.scoop]
cmd_format = "scoop update"

[actions.upgrade.scoop]
cmd_format = "scoop update *"

[actions.force_update.scoop]
cmd_format = "scoop update --force"

[actions.force_upgrade.scoop]
cmd_format = "scoop update * --force"

[actions.info.scoop]
cmd_format = "scoop info {pkgs}"

[actions.list_installed.scoop]
cmd_format = "scoop list"

[actions.clean.scoop]
cmd_format = "scoop cache rm *"

[actions.help.scoop]
cmd_format = "scoop --help"

[actions.list_files.scoop]
cmd_format = "scoop prefix {pkgs} && dir /s /b"

[actions.find_file_owner.scoop]
cmd_format = "scoop which {files}"

[actions.find_file_owner_remote.scoop]
cmd_format = "scoop search {files}"

[actions.download_source.scoop]
cmd_format = "scoop download {pkgs}"

# === Scoop Parameter Parsing ===
[action_interfaces.scoop.args.scoop_command]
cmd_name = "scoop"
arg_parser = "argparse"

# Scoop global help parameter
[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# Scoop subcommands
[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "update"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "list"
is_sub_cmd = true

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "cache"
is_sub_cmd = true

[[action_interfaces.scoop.args.scoop_command.arg_parse.sub_args]]
name = "rm"
long_opt = "rm"
arg = "cache_remove"
is_flag = true

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "prefix"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "which"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.scoop.args.scoop_command.arg_parse]]
name = "download"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === Scoop Action Trigger Rules ===
[action_interfaces.scoop.triggers.scoop_command]
cmd_name = "scoop"

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_upgrade" },
    { params = [], action = "upgrade" }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "list_installed" }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "clean_operations"
condition = { params = [{ name = "cache", is_sub_cmd = true }, { name = "rm" }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "list_files_operations"
condition = { params = [{ name = "prefix", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "list_files", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "find_file_owner_operations"
condition = { params = [{ name = "which", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "find_file_owner", arg_map = { targets = "files" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "find_file_owner_remote_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "download_source_operations"
condition = { params = [{ name = "download", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "download_source", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.scoop.triggers.scoop_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]