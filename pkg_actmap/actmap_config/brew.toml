# Homebrew 包管理器配置

# === Homebrew 命令实现 ===
[actions.install.brew]
cmd_format = "brew install {pkgs}"

[actions.remove.brew]
cmd_format = "brew uninstall {pkgs}"

[actions.search.brew]
cmd_format = "brew search {pkgs}"

[actions.update.brew]
cmd_format = "brew update"

[actions.upgrade.brew]
cmd_format = "brew upgrade"

[actions.force_update.brew]
cmd_format = "brew update --force"

[actions.force_upgrade.brew]
cmd_format = "brew upgrade --force"

[actions.info.brew]
cmd_format = "brew info {pkgs}"

[actions.list_installed.brew]
cmd_format = "brew list"

[actions.clean.brew]
cmd_format = "brew cleanup"

[actions.help.brew]
cmd_format = "brew --help"

[actions.list_files.brew]
cmd_format = "brew list --verbose {pkgs}"

[actions.find_file_owner.brew]
cmd_format = "brew list --verbose | grep {files}"

[actions.find_file_owner_remote.brew]
cmd_format = "brew search {files}"

[actions.download_source.brew]
cmd_format = "brew install --build-from-source {pkgs}"

# === Homebrew 参数解析 ===
[action_interfaces.brew.args.brew_command]
cmd_name = "brew"
arg_parser = "argparse"

# Homebrew 全局帮助参数
[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# Homebrew 子命令
[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.brew.args.brew_command.arg_parse.sub_args]]
name = "build_from_source"
long_opt = "--build-from-source"
arg = "build_source_flag"
is_flag = true

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.brew.args.brew_command.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "upgrade"
is_sub_cmd = true

[[action_interfaces.brew.args.brew_command.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "list"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.brew.args.brew_command.arg_parse.sub_args]]
name = "verbose"
long_opt = "--verbose"
arg = "verbose_flag"
is_flag = true

[[action_interfaces.brew.args.brew_command.arg_parse]]
name = "cleanup"
is_sub_cmd = true

# === Homebrew 动作触发规则 ===
[action_interfaces.brew.triggers.brew_command]
cmd_name = "brew"

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "build_from_source" }], action = "download_source", arg_map = { targets = "pkgs" } },
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "force" }], action = "force_upgrade" },
    { params = [], action = "upgrade" }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "verbose" }], action = "list_files", arg_map = { targets = "pkgs" } },
    { params = [], action = "list_installed" }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "clean_operations"
condition = { params = [{ name = "cleanup", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.brew.triggers.brew_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]