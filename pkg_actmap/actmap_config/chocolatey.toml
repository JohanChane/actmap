# Chocolatey 包管理器配置 (Windows)

[actions.install.chocolatey]
cmd_format = "choco install {pkgs} -y"

[actions.remove.chocolatey]
cmd_format = "choco uninstall {pkgs} -y"

[actions.search.chocolatey]
cmd_format = "choco search {pkgs}"

[actions.update.chocolatey]
cmd_format = "choco upgrade all -y"

[actions.upgrade.chocolatey]
cmd_format = "choco upgrade all -y"

[actions.force_update.chocolatey]
cmd_format = "choco upgrade all -y --force"

[actions.force_upgrade.chocolatey]
cmd_format = "choco upgrade all -y --force"

[actions.info.chocolatey]
cmd_format = "choco info {pkgs}"

[actions.list_installed.chocolatey]
cmd_format = "choco list --local-only"

[actions.clean.chocolatey]
cmd_format = "choco optimize --reduce-nupkg-only"

[actions.help.chocolatey]
cmd_format = "choco -h"

[action_interfaces.chocolatey.args]
arg_parser = "argparse"

[[action_interfaces.chocolatey.args.arg_parse]]
name = "help"
long_opt = "--help"
short_opt = "-h"
arg = "help"
is_flag = true

[[action_interfaces.chocolatey.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.chocolatey.args.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.chocolatey.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.chocolatey.args.arg_parse]]
name = "upgrade"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.chocolatey.args.arg_parse.sub_args]]
name = "all"
long_opt = "--all"
arg = "upgrade_all"
is_flag = true

[[action_interfaces.chocolatey.args.arg_parse.sub_args]]
name = "force"
long_opt = "--force"
arg = "force_flag"
is_flag = true

[[action_interfaces.chocolatey.args.arg_parse]]
name = "list"
is_sub_cmd = true

[[action_interfaces.chocolatey.args.arg_parse.sub_args]]
name = "local_only"
long_opt = "--local-only"
arg = "local_only_flag"
is_flag = true

[[action_interfaces.chocolatey.args.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.chocolatey.args.arg_parse]]
name = "optimize"
is_sub_cmd = true

[action_interfaces.chocolatey.triggers]

[[action_interfaces.chocolatey.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [{ params = [], action = "install" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [{ params = [], action = "remove" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [{ params = [], action = "search" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "all" }], action = "update" },
    { params = [{ name = "all" }, { name = "force" }], action = "force_update" }
]

[[action_interfaces.chocolatey.triggers.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [{ params = [], action = "info" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [{ params = [{ name = "local_only" }], action = "list_installed" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "clean_operations"
condition = { params = [{ name = "optimize", is_sub_cmd = true }] }
trigger = [{ params = [], action = "clean" }]

[[action_interfaces.chocolatey.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [{ params = [], action = "help" }]