# Cargo 包管理器配置 (Rust)

[actions.install.cargo]
cmd_format = "cargo install {pkgs}"

[actions.remove.cargo]
cmd_format = "cargo uninstall {pkgs}"

[actions.search.cargo]
cmd_format = "cargo search {pkgs}"

[actions.list_installed.cargo]
cmd_format = "cargo install --list"

[actions.info.cargo]
cmd_format = "cargo search {pkgs} --limit=1"  # Cargo 没有专门的 info 命令，用 search 替代

[actions.update.cargo]
cmd_format = "cargo install-update -a"  # 需要 cargo-install-update 插件

[actions.upgrade.cargo]
cmd_format = "cargo install-update -a"  # 更新所有已安装的二进制包

[actions.clean.cargo]
cmd_format = "cargo clean"  # 清理编译缓存

[actions.help.cargo]
cmd_format = "cargo --help"

[actions.build.cargo]
cmd_format = "cargo build"

[actions.run.cargo]
cmd_format = "cargo run"

[actions.test.cargo]
cmd_format = "cargo test"

[actions.check.cargo]
cmd_format = "cargo check"

[actions.doc.cargo]
cmd_format = "cargo doc"

[action_interfaces.cargo.args]
arg_parser = "argparse"

[[action_interfaces.cargo.args.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

[[action_interfaces.cargo.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.cargo.args.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.cargo.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.cargo.args.arg_parse]]
name = "build"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "run"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "test"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "check"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "doc"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "clean"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse]]
name = "install-update"
is_sub_cmd = true

[[action_interfaces.cargo.args.arg_parse.sub_args]]
name = "all"
short_opt = "-a"
arg = "update_all"
is_flag = true

[action_interfaces.cargo.triggers]

[[action_interfaces.cargo.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [{ params = [], action = "install" }]

[[action_interfaces.cargo.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [{ params = [], action = "remove" }]

[[action_interfaces.cargo.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [{ params = [], action = "search" }]

[[action_interfaces.cargo.triggers.rules]]
name = "build_operations"
condition = { params = [{ name = "build", is_sub_cmd = true }] }
trigger = [{ params = [], action = "build" }]

[[action_interfaces.cargo.triggers.rules]]
name = "run_operations"
condition = { params = [{ name = "run", is_sub_cmd = true }] }
trigger = [{ params = [], action = "run" }]

[[action_interfaces.cargo.triggers.rules]]
name = "test_operations"
condition = { params = [{ name = "test", is_sub_cmd = true }] }
trigger = [{ params = [], action = "test" }]

[[action_interfaces.cargo.triggers.rules]]
name = "check_operations"
condition = { params = [{ name = "check", is_sub_cmd = true }] }
trigger = [{ params = [], action = "check" }]

[[action_interfaces.cargo.triggers.rules]]
name = "doc_operations"
condition = { params = [{ name = "doc", is_sub_cmd = true }] }
trigger = [{ params = [], action = "doc" }]

[[action_interfaces.cargo.triggers.rules]]
name = "clean_operations"
condition = { params = [{ name = "clean", is_sub_cmd = true }] }
trigger = [{ params = [], action = "clean" }]

[[action_interfaces.cargo.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "install-update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "all" }], action = "update" },
    { params = [], action = "update" }
]

[[action_interfaces.cargo.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [{ params = [], action = "help" }]