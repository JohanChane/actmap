# npm 包管理器配置 (Node.js)

[actions.install.npm]
cmd_format = "npm install {pkgs}"

[actions.remove.npm]
cmd_format = "npm uninstall {pkgs}"

[actions.search.npm]
cmd_format = "npm search {pkgs}"

[actions.list_installed.npm]
cmd_format = "npm list"

[actions.info.npm]
cmd_format = "npm info {pkgs}"

[actions.update.npm]
cmd_format = "npm update"

[actions.help.npm]
cmd_format = "npm help"

[action_interfaces.npm.args]
arg_parser = "argparse"

[[action_interfaces.npm.args.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

[[action_interfaces.npm.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.npm.args.arg_parse]]
name = "uninstall"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.npm.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.npm.args.arg_parse]]
name = "list"
is_sub_cmd = true

[[action_interfaces.npm.args.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.npm.args.arg_parse]]
name = "update"
is_sub_cmd = true

[action_interfaces.npm.triggers]

[[action_interfaces.npm.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [{ params = [], action = "install" }]

[[action_interfaces.npm.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "uninstall", is_sub_cmd = true }] }
trigger = [{ params = [], action = "remove" }]

[[action_interfaces.npm.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [{ params = [], action = "search" }]

[[action_interfaces.npm.triggers.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [{ params = [], action = "list_installed" }]

[[action_interfaces.npm.triggers.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [{ params = [], action = "info" }]

[[action_interfaces.npm.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [{ params = [], action = "update" }]

[[action_interfaces.npm.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [{ params = [], action = "help" }]