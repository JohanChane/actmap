# APT 包管理器配置

# === APT 命令实现 ===
[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.remove.apt]
cmd_format = "apt remove {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.update.apt]
cmd_format = "apt update"

[actions.upgrade.apt]
cmd_format = "apt upgrade"

[actions.force_update.apt]
cmd_format = "apt update --refresh-all"

[actions.force_upgrade.apt]
cmd_format = "apt update --refresh-all && apt upgrade"

[actions.info.apt]
cmd_format = "apt show {pkgs}"

[actions.list_installed.apt]
cmd_format = "apt list --installed"

[actions.clean.apt]
cmd_format = "apt autoclean"

[actions.help.apt]
cmd_format = "apt --help"

# === APT 参数解析 ===
[action_interfaces.apt.args]
arg_parser = "argparse"

# APT 全局帮助参数
[[action_interfaces.apt.args.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT 子命令
[[action_interfaces.apt.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "remove"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.apt.args.arg_parse.sub_args]]
name = "refresh_all"
long_opt = "--refresh-all"
arg = "refresh_all_flag"
is_flag = true

[[action_interfaces.apt.args.arg_parse]]
name = "upgrade"
is_sub_cmd = true

[[action_interfaces.apt.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "show"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "list"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse.sub_args]]
name = "installed"
long_opt = "--installed"
arg = "installed_only"
is_flag = true

[[action_interfaces.apt.args.arg_parse]]
name = "autoclean"
is_sub_cmd = true

# === APT 动作触发规则 ===
[action_interfaces.apt.triggers]

[[action_interfaces.apt.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install" }
]

[[action_interfaces.apt.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "remove", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove" }
]

[[action_interfaces.apt.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "refresh_all" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.apt.triggers.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "upgrade" }
]

[[action_interfaces.apt.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search" }
]

[[action_interfaces.apt.triggers.rules]]
name = "info_operations"
condition = { params = [{ name = "show", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info" }
]

[[action_interfaces.apt.triggers.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "installed" }], action = "list_installed" },
    { params = [], action = "search" }
]

[[action_interfaces.apt.triggers.rules]]
name = "clean_operations"
condition = { params = [{ name = "autoclean", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.apt.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]