# APT Package Manager Configuration

# === APT Command Implementation ===
[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.remove.apt]
cmd_format = "apt remove {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.update.apt]
cmd_format = "apt update"

[actions.upgrade.apt]
cmd_format = "apt upgrade"

[actions.force_update.apt]
cmd_format = "apt update --refresh-all"

[actions.force_upgrade.apt]
cmd_format = "apt update --refresh-all && apt upgrade"

[actions.info.apt]
cmd_format = "apt show {pkgs}"

[actions.list_installed.apt]
cmd_format = "apt list --installed"

[actions.clean.apt]
cmd_format = "apt autoclean"

[actions.help.apt]
cmd_format = "apt --help"

[actions.list_files.apt]
cmd_format = "dpkg -L {pkgs}"

[actions.find_file_owner.apt]
cmd_format = "dpkg -S {files}"

[actions.find_file_owner_remote.apt]
cmd_format = "apt-file search {files}"

[actions.download_source.apt]
cmd_format = "apt source {pkgs}"

# === APT Parameter Parsing ===
[action_interfaces.apt.args.apt_command]
cmd_name = "apt"
arg_parser = "argparse"

# APT global help parameter
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT subcommands
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "remove"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.apt.args.apt_command.arg_parse.sub_args]]
name = "refresh_all"
long_opt = "--refresh-all"
arg = "refresh_all_flag"
is_flag = true

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "upgrade"
is_sub_cmd = true

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "show"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "list"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse.sub_args]]
name = "installed"
long_opt = "--installed"
arg = "installed_only"
is_flag = true

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "autoclean"
is_sub_cmd = true

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "source"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === APT Action Trigger Rules ===
[action_interfaces.apt.triggers.apt_command]
cmd_name = "apt"

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "remove_operations"
condition = { params = [{ name = "remove", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "refresh_all" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "upgrade" }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "info_operations"
condition = { params = [{ name = "show", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "installed" }], action = "list_installed" },
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "clean_operations"
condition = { params = [{ name = "autoclean", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "download_source_operations"
condition = { params = [{ name = "source", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "download_source", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# === DPKG Parameter Parsing ===
[action_interfaces.apt.args.dpkg_command]
cmd_name = "dpkg"
arg_parser = "getopt"

# dpkg options
[[action_interfaces.apt.args.dpkg_command.arg_parse]]
name = "listfiles"
short_opt = "-L"
arg = "list_files"
is_flag = true

[[action_interfaces.apt.args.dpkg_command.arg_parse]]
name = "search"
short_opt = "-S"
arg = "search_files"
is_flag = true

# Use unified targets parameter name
[[action_interfaces.apt.args.dpkg_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

# === DPKG Action Trigger Rules ===
[action_interfaces.apt.triggers.dpkg_command]
cmd_name = "dpkg"

# dpkg operation group
[[action_interfaces.apt.triggers.dpkg_command.rules]]
name = "dpkg_operations"
condition = { params = [] }
trigger = [
    { params = [{ name = "listfiles" }], action = "list_files", arg_map = { targets = "pkgs" } },
    { params = [{ name = "search" }], action = "find_file_owner", arg_map = { targets = "files" } }
]

# === APT-FILE Parameter Parsing ===
[action_interfaces.apt.args.apt_file_command]
cmd_name = "apt-file"
arg_parser = "argparse"

[[action_interfaces.apt.args.apt_file_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === APT-FILE Action Trigger Rules ===
[action_interfaces.apt.triggers.apt_file_command]
cmd_name = "apt-file"

[[action_interfaces.apt.triggers.apt_file_command.rules]]
name = "find_file_owner_remote_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]