# 基础包管理器动作定义

# === 通用动作定义 ===
# ## install
[actions.install]
description = "安装软件包"
args = ["pkgs"]

# ## remove
[actions.remove]
description = "卸载软件包"
args = ["pkgs"]

# ## search
[actions.search]
description = "搜索软件包"
args = ["pkgs"]

# ## update
[actions.update]
description = "更新软件包数据库"
args = []

# ## upgrade
[actions.upgrade]
description = "升级所有软件包"
args = []

# ## force_update
[actions.force_update]
description = "强制更新软件包数据库"
args = []

# ## force_upgrade
[actions.force_upgrade]
description = "强制刷新并升级系统"
args = []

# ## info
[actions.info]
description = "显示软件包信息"
args = ["pkgs"]

# ## list_installed
[actions.list_installed]
description = "列出已安装的软件包"
args = []

# ## clean
[actions.clean]
description = "清理缓存"
args = []

# ## help
[actions.help]
description = "显示帮助信息"
args = []

# ## list_files (列出包文件)
[actions.list_files]
description = "列出包的文件"
args = ["pkgs"]

# ## 本地查找文件所属包
[actions.find_file_owner]
description = "查找文件属于哪个包（本地已安装）"
args = ["files"]

# ## 云端查找文件所属包  
[actions.find_file_owner_remote]
description = "从仓库查找文件属于哪个包"
args = ["files"]

# ## 下载包的源码
[actions.download_source]
description = "下载包的源码"
args = ["pkgs"]

# === 动作接口定义 ===
[action_interfaces]