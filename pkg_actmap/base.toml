# Base Package Manager Action Definitions

# === Common Action Definitions ===
# ## install
[actions.install]
description = "Install packages"
args = ["pkgs"]

# ## remove
[actions.remove]
description = "Uninstall packages"
args = ["pkgs"]

# ## search
[actions.search]
description = "Search packages"
args = ["pkgs"]

# ## update
[actions.update]
description = "Update package database"
args = []

# ## upgrade
[actions.upgrade]
description = "Upgrade all packages"
args = []

# ## force_update
[actions.force_update]
description = "Force update package database"
args = []

# ## force_upgrade
[actions.force_upgrade]
description = "Force refresh and upgrade system"
args = []

# ## info
[actions.info]
description = "Display package information"
args = ["pkgs"]

# ## list_installed
[actions.list_installed]
description = "List installed packages"
args = []

# ## clean
[actions.clean]
description = "Clean cache"
args = []

# ## help
[actions.help]
description = "Display help information"
args = []

# ## list_files (List package files)
[actions.list_files]
description = "List package files"
args = ["pkgs"]

# ## Find file owner locally
[actions.find_file_owner]
description = "Find which package owns the file (locally installed)"
args = ["files"]

# ## Find file owner from repository
[actions.find_file_owner_remote]
description = "Find which package owns the file from repository"
args = ["files"]

# ## Download package source code
[actions.download_source]
description = "Download package source code"
args = ["pkgs"]

# === Action Interface Definitions ===
[action_interfaces]