# ActMap - 扩展动作测试配置文件

# === 扩展动作定义 ===
# ## install
[actions.install]
description = "安装软件包"
args = ["pkgs"]

[actions.install.pacman]
cmd_format = "pacman -S {pkgs}"

[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.install.brew]
cmd_format = "brew install {pkgs}"

# ## remove
[actions.remove]
description = "卸载软件包"
args = ["pkgs"]

[actions.remove.pacman]
cmd_format = "pacman -R {pkgs}"

[actions.remove.apt]
cmd_format = "apt remove {pkgs}"

[actions.remove.brew]
cmd_format = "brew uninstall {pkgs}"

# ## update
[actions.update]
description = "更新软件包数据库"
args = []

[actions.update.pacman]
cmd_format = "pacman -Sy"

[actions.update.apt]
cmd_format = "apt update"

[actions.update.brew]
cmd_format = "brew update"

# ## upgrade
[actions.upgrade]
description = "升级所有软件包"
args = []

[actions.upgrade.pacman]
cmd_format = "pacman -Syu"

[actions.upgrade.apt]
cmd_format = "apt upgrade"

[actions.upgrade.brew]
cmd_format = "brew upgrade"

# ## search
[actions.search]
description = "搜索软件包"
args = ["pkgs"]

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.search.brew]
cmd_format = "brew search {pkgs}"

# ## info
[actions.info]
description = "显示软件包信息"
args = ["pkgs"]

[actions.info.pacman]
cmd_format = "pacman -Si {pkgs}"

[actions.info.apt]
cmd_format = "apt show {pkgs}"

[actions.info.brew]
cmd_format = "brew info {pkgs}"

# ## list_installed
[actions.list_installed]
description = "列出已安装的软件包"
args = []

[actions.list_installed.pacman]
cmd_format = "pacman -Q"

[actions.list_installed.apt]
cmd_format = "apt list --installed"

[actions.list_installed.brew]
cmd_format = "brew list"

# ## clean
[actions.clean]
description = "清理缓存"
args = []

[actions.clean.pacman]
cmd_format = "pacman -Sc"

[actions.clean.apt]
cmd_format = "apt autoclean"

[actions.clean.brew]
cmd_format = "brew cleanup"

# ## help
[actions.help]
description = "显示帮助信息"
args = []

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.help.apt]
cmd_format = "apt --help"

[actions.help.brew]
cmd_format = "brew --help"

# === pacman 命令的参数解析与动作匹配规则 ===
[action_interfaces.pacman.args]
arg_parser = "getopt"

# 全局参数 -h
[[action_interfaces.pacman.args.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

[[action_interfaces.pacman.args.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.pacman.args.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "search_flag"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "y"
short_opt = "-y"
arg = "refresh_db"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "u"
short_opt = "-u"
arg = "upgrade_flag"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "i"
short_opt = "-i"
arg = "info_flag"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "c"
short_opt = "-c"
arg = "clean_flag"
is_flag = true

[[action_interfaces.pacman.args.arg_parse]]
name = "R"
short_opt = "-R"
is_flag = true

[[action_interfaces.pacman.args.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true

[[action_interfaces.pacman.args.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "query_search_flag"
is_flag = true

# Pacman 动作触发规则
[action_interfaces.pacman.triggers]

[[action_interfaces.pacman.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

[[action_interfaces.pacman.triggers.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    # 优先级1: 同时有 -y 和 -u 参数 → upgrade
    { params = [{ name = "y" }, { name = "u" }], action = "upgrade" },
    # 优先级2: 只有 -y 参数 → update  
    { params = [{ name = "y" }], action = "update" },
    # 优先级3: 只有 -s 参数 → search
    { params = [{ name = "s" }], action = "search" },
    # 优先级4: 只有 -i 参数 → info
    { params = [{ name = "i" }], action = "info" },
    # 优先级5: 只有 -c 参数 → clean
    { params = [{ name = "c" }], action = "clean" },
    # 优先级6: 默认 → install
    { params = [], action = "install" }
]

[[action_interfaces.pacman.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "R" }] }
trigger = [
    { params = [], action = "remove" }
]

[[action_interfaces.pacman.triggers.rules]]
name = "query_operations"
condition = { params = [{ name = "Q" }] }
trigger = [
    { params = [{ name = "s" }], action = "search" },
    { params = [], action = "list_installed" }
]

[[action_interfaces.pacman.triggers.rules]]
name = "no_arg"
condition = { params = [] }
trigger = [
    { params = [], action = "install" }
]

# === APT 命令的参数解析与动作匹配规则 ===
[action_interfaces.apt.args]
arg_parser = "argparse"

[[action_interfaces.apt.args.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

[[action_interfaces.apt.args.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "remove"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.apt.args.arg_parse]]
name = "upgrade"
is_sub_cmd = true

[[action_interfaces.apt.args.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "show"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse]]
name = "list"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.arg_parse.sub_args]]
name = "installed"
long_opt = "--installed"
arg = "installed_only"
is_flag = true

[[action_interfaces.apt.args.arg_parse]]
name = "autoclean"
is_sub_cmd = true

# APT 动作触发规则
[action_interfaces.apt.triggers]

[[action_interfaces.apt.triggers.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install" }
]

[[action_interfaces.apt.triggers.rules]]
name = "remove_operations"
condition = { params = [{ name = "remove", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "remove" }
]

[[action_interfaces.apt.triggers.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "update" }
]

[[action_interfaces.apt.triggers.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "upgrade" }
]

[[action_interfaces.apt.triggers.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search" }
]

[[action_interfaces.apt.triggers.rules]]
name = "info_operations"
condition = { params = [{ name = "show", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info" }
]

[[action_interfaces.apt.triggers.rules]]
name = "list_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "installed" }], action = "list_installed" },
    { params = [], action = "search" }  # 默认情况
]

[[action_interfaces.apt.triggers.rules]]
name = "clean_operations"
condition = { params = [{ name = "autoclean", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "clean" }
]

[[action_interfaces.apt.triggers.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

