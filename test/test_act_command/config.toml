# ActMap - cat grep grep Test Configuration

[actions.grep_single]
description = "Single condition file search"
args = ["files", "pattern1"]

[actions.grep_single.shell]
cmd_format = "cat {files} | grep {pattern1}"

[actions.grep_double]
description = "Double condition file search"
args = ["files", "pattern1", "pattern2"]

[actions.grep_double.shell]
cmd_format = "cat {files} | grep {pattern1} | grep {pattern2}"

[actions.grep_triple]
description = "Triple condition file search"
args = ["files", "pattern1", "pattern2", "pattern3"]

[actions.grep_triple.shell]
cmd_format = "cat {files} | grep {pattern1} | grep {pattern2} | grep {pattern3}"

[actions.grep_multi_files]
description = "Multi-file search"
args = ["files", "pattern1"]

[actions.grep_multi_files.shell]
cmd_format = "cat {files} | grep {pattern1}"

[actions.grep_special_chars]
description = "Special character search"
args = ["files", "pattern1", "pattern2"]

[actions.grep_special_chars.shell]
cmd_format = "cat {files} | grep {pattern1} | grep {pattern2}"

# === Global Configuration ===
[config]
default_target_actmap = "shell"