# ActMap - DNF/RPM ↔ Pacman 文件操作映射测试配置文件

# === 动作定义 ===
[actions.search]
description = "搜索软件包"
args = ["pkgs"]

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.search.dnf]
cmd_format = "dnf search {pkgs}"

[actions.info]
description = "显示软件包信息"
args = ["pkgs"]

[actions.info.pacman]
cmd_format = "pacman -Si {pkgs}"

[actions.info.dnf]
cmd_format = "dnf info {pkgs}"

[actions.list_files]
description = "列出包的文件"
args = ["pkgs"]

[actions.list_files.pacman]
cmd_format = "pacman -Ql {pkgs}"

[actions.list_files.dnf]
cmd_format = "rpm -ql {pkgs}"

[actions.find_file_owner]
description = "查找文件属于哪个包"
args = ["files"]

[actions.find_file_owner.pacman]
cmd_format = "pacman -Qo {files}"

[actions.find_file_owner.dnf]
cmd_format = "rpm -qf {files}"

[actions.find_file_owner_remote]
description = "从仓库查找文件属于哪个包"
args = ["files"]

[actions.find_file_owner_remote.pacman]
cmd_format = "pacman -F {files}"

[actions.find_file_owner_remote.dnf]
cmd_format = "dnf provides {files}"

# === Pacman 参数解析 ===
[action_interfaces.pacman.args.pacman_command]
cmd_name = "pacman"
arg_parser = "getopt"

# 使用统一的 targets 参数名
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "i"
short_opt = "-i"
arg = "info_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "query_search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "l"
short_opt = "-l"
arg = "list_files_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "o"
short_opt = "-o"
arg = "find_file_owner_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "F"
short_opt = "-F"
is_flag = true

# === Pacman 动作触发规则 ===
[action_interfaces.pacman.triggers.pacman_command]
cmd_name = "pacman"

# Sync 操作组 (-S 相关)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [{ name = "i" }], action = "info", arg_map = { targets = "pkgs" } }
]

# Query 操作组 (-Q 相关)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "query_operations"
condition = { params = [{ name = "Q" }] }
trigger = [
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [{ name = "l" }], action = "list_files", arg_map = { targets = "pkgs" } },
    { params = [{ name = "o" }], action = "find_file_owner", arg_map = { targets = "files" } }
]

# 文件查找操作组 (-F 相关)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "find_file_remote_operations"
condition = { params = [{ name = "F" }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]

# === DNF 参数解析 ===
[action_interfaces.dnf.args.dnf_command]
cmd_name = "dnf"
arg_parser = "argparse"

# DNF 子命令
[[action_interfaces.dnf.args.dnf_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.dnf.args.dnf_command.arg_parse]]
name = "info"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.dnf.args.dnf_command.arg_parse]]
name = "provides"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === DNF 动作触发规则 ===
[action_interfaces.dnf.triggers.dnf_command]
cmd_name = "dnf"

[[action_interfaces.dnf.triggers.dnf_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.dnf.triggers.dnf_command.rules]]
name = "info_operations"
condition = { params = [{ name = "info", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "info", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.dnf.triggers.dnf_command.rules]]
name = "provides_operations"
condition = { params = [{ name = "provides", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "find_file_owner_remote", arg_map = { targets = "files" } }
]

# === RPM 参数解析 ===
[action_interfaces.dnf.args.rpm_command]
cmd_name = "rpm"
arg_parser = "getopt"

# 查询选项
[[action_interfaces.dnf.args.rpm_command.arg_parse]]
name = "query"
short_opt = "-q"
is_flag = true

# -q 的子参数
[[action_interfaces.dnf.args.rpm_command.arg_parse.sub_args]]
name = "file"
short_opt = "-f"
arg = "query_file_flag"
is_flag = true

[[action_interfaces.dnf.args.rpm_command.arg_parse.sub_args]]
name = "list"
short_opt = "-l"
arg = "query_list_flag"
is_flag = true

[[action_interfaces.dnf.args.rpm_command.arg_parse.sub_args]]
name = "info"
short_opt = "-i"
arg = "query_info_flag"
is_flag = true

# 使用统一的 targets 参数名
[[action_interfaces.dnf.args.rpm_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

# === RPM 动作触发规则 ===
[action_interfaces.dnf.triggers.rpm_command]
cmd_name = "rpm"

# Query 操作组 (-q 相关)
[[action_interfaces.dnf.triggers.rpm_command.rules]]
name = "query_operations"
condition = { params = [{ name = "query" }] }
trigger = [
    { params = [{ name = "file" }], action = "find_file_owner", arg_map = { targets = "files" } },
    { params = [{ name = "list" }], action = "list_files", arg_map = { targets = "pkgs" } },
    { params = [{ name = "info" }], action = "info", arg_map = { targets = "pkgs" } }
]

# === 全局配置 ===
[config]
default_target_action = "pacman"