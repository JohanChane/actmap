# ActMap - Repeatable Option Test Configuration File

# === Action Definitions ===
[actions.update]
description = "Update package database"
args = []

[actions.update.pacman]
cmd_format = "pacman -Sy"

[actions.update.apt]
cmd_format = "apt update"

[actions.force_update]
description = "Force update package database"
args = []

[actions.force_update.pacman]
cmd_format = "pacman -Syy"

[actions.force_update.apt]
cmd_format = "apt update --refresh-all"

[actions.upgrade]
description = "Upgrade system"
args = []

[actions.upgrade.pacman]
cmd_format = "pacman -Syu"

[actions.upgrade.apt]
cmd_format = "apt upgrade"

[actions.force_upgrade]
description = "Force refresh and upgrade system"
args = []

[actions.force_upgrade.pacman]
cmd_format = "pacman -Syyu"

[actions.force_upgrade.apt]
cmd_format = "apt update --refresh-all && apt upgrade"

[actions.help]
description = "Display help information"
args = []

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.help.apt]
cmd_format = "apt --help"

# === pacman Parameter Parsing ===
[action_interfaces.pacman.args.pacman_command]
cmd_name = "pacman"
arg_parser = "getopt"

# Global parameter -h
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

# Use unified targets parameter name
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "y"
short_opt = "-y"
arg = "refresh"
is_flag = true
is_repeatable = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "u"
short_opt = "-u"
arg = "upgrade"
is_flag = true

# === pacman Action Trigger Rules ===
[action_interfaces.pacman.triggers.pacman_command]
cmd_name = "pacman"

# Global help trigger rule
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# Sync operation group (-S related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    # Force refresh upgrade: two y parameters
    { params = [{ name = "y", repeat = 2 }, { name = "u" }], action = "force_upgrade" },
    # Force update: two y parameters
    { params = [{ name = "y", repeat = 2 }], action = "force_update" },
    # Normal upgrade: one y parameter + u parameter
    { params = [{ name = "y" }, { name = "u" }], action = "upgrade" },
    # Normal update: one y parameter
    { params = [{ name = "y" }], action = "update" },
    { params = [{ name = "u" }], action = "upgrade" },
]

# Default operation when no parameters specified
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "no_arg"
condition = { params = [] }
trigger = [
    { params = [], action = "help" }
]

# === APT Parameter Parsing ===
[action_interfaces.apt.args.apt_command]
cmd_name = "apt"
arg_parser = "argparse"

# APT global help parameter
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT subcommands
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "update"
is_sub_cmd = true

[[action_interfaces.apt.args.apt_command.arg_parse.sub_args]]
name = "refresh_all"
long_opt = "--refresh-all"
arg = "refresh_all_flag"
is_flag = true

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "upgrade"
is_sub_cmd = true

# === APT Action Trigger Rules ===
[action_interfaces.apt.triggers.apt_command]
cmd_name = "apt"

# APT operation group
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "update_operations"
condition = { params = [{ name = "update", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "refresh_all" }], action = "force_update" },
    { params = [], action = "update" }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "upgrade_operations"
condition = { params = [{ name = "upgrade", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "upgrade" }
]

# APT help trigger rule
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# === Global Configuration ===
[config]
default_target_actmap = "pacman"