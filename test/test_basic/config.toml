# ActMap - Basic Test Configuration File

# === Action Definitions ===
[actions.install]
description = "Install packages"
args = ["pkgs"]

[actions.install.pacman]
cmd_format = "pacman -S {pkgs}"

[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.search]
description = "Search packages"
args = ["pkgs"]

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.help]
description = "Display help information"
args = []

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.help.apt]
cmd_format = "apt --help"

# === pacman Parameter Parsing ===
[action_interfaces.pacman.args.pacman_command]
cmd_name = "pacman"
arg_parser = "getopt"

# Global parameter -h
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

# Use unified targets parameter name
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "targets"
nargs = "*"

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "query_search_flag"
is_flag = true

# === pacman Action Trigger Rules ===
[action_interfaces.pacman.triggers.pacman_command]
cmd_name = "pacman"

# Global help trigger rule
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# Sync operation group (-S related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

# Query operation group (-Q related)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "query_operations"
condition = { params = [{ name = "Q" }] }
trigger = [
    { params = [{ name = "s" }], action = "search", arg_map = { targets = "pkgs" } },
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

# Default operation when no parameters specified
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "no_arg"
condition = { params = [] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

# === APT Parameter Parsing ===
[action_interfaces.apt.args.apt_command]
cmd_name = "apt"
arg_parser = "argparse"

# APT global help parameter
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT subcommands
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "targets"
nargs = "*"

# === APT Action Trigger Rules ===
[action_interfaces.apt.triggers.apt_command]
cmd_name = "apt"

# APT operation group
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search", arg_map = { targets = "pkgs" } }
]

# APT help trigger rule
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# === Global Configuration ===
[config]
default_target_actmap = "pacman"