# ActMap - 基础测试配置文件

# === 动作定义 ===
[actions.install]
description = "安装软件包"
args = ["pkgs"]

[actions.install.pacman]
cmd_format = "pacman -S {pkgs}"

[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.search]
description = "搜索软件包"
args = ["pkgs"]

[actions.search.pacman]
cmd_format = "pacman -Ss {pkgs}"

[actions.search.apt]
cmd_format = "apt search {pkgs}"

[actions.help]
description = "显示帮助信息"
args = []

[actions.help.pacman]
cmd_format = "pacman -h"

[actions.help.apt]
cmd_format = "apt --help"

# === pacman 参数解析 ===
[action_interfaces.pacman.args.pacman_command]
cmd_name = "pacman"
arg_parser = "getopt"

# 全局参数 -h
[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "help"
short_opt = "-h"
arg = "help"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "cmd_arg"
is_cmd_arg = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "S"
short_opt = "-S"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "search_flag"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse]]
name = "Q"
short_opt = "-Q"
is_flag = true

[[action_interfaces.pacman.args.pacman_command.arg_parse.sub_args]]
name = "s"
short_opt = "-s"
arg = "query_search_flag"
is_flag = true

# === pacman 动作触发规则 ===
[action_interfaces.pacman.triggers.pacman_command]
cmd_name = "pacman"

# 全局帮助触发规则
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# Sync 操作组 (-S 相关)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "sync_operations"
condition = { params = [{ name = "S" }] }
trigger = [
    { params = [{ name = "s" }], action = "search" },
    { params = [], action = "install" }
]

# Query 操作组 (-Q 相关)
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "query_operations"
condition = { params = [{ name = "Q" }] }
trigger = [
    { params = [{ name = "s" }], action = "search" },
    { params = [], action = "search" }
]

# 没有指定参数时的默认操作
[[action_interfaces.pacman.triggers.pacman_command.rules]]
name = "no_arg"
condition = { params = [] }
trigger = [
    { params = [], action = "install" }
]

# === APT 参数解析 ===
[action_interfaces.apt.args.apt_command]
cmd_name = "apt"
arg_parser = "argparse"

# APT 全局帮助参数
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT 子命令
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "search"
is_sub_cmd = true
arg = "pkgs"
nargs = "*"

# === APT 动作触发规则 ===
[action_interfaces.apt.triggers.apt_command]
cmd_name = "apt"

# APT 操作组
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install" }
]

[[action_interfaces.apt.triggers.apt_command.rules]]
name = "search_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search" }
]

# APT 帮助触发规则
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# === 全局配置 ===
[config]
default_target_action = "pacman"