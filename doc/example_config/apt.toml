# APT 包管理器配置

# === action 的定义 ===
[actions.install.apt]
cmd_format = "apt install {pkgs}"

[actions.search_remote.apt]
cmd_format = "apt search {pkgs}"

[actions.search_local.apt]
cmd_format = "apt list --installed {pkgs}"      #  `{pkgs}` 用户要安装的包且 `{pkgs}` 不能为空

[actions.list_installed.apt]
cmd_format = "apt list --installed"

[actions.help.apt]
cmd_format = "apt --help"

# === APT 参数解析 ===
[action_interfaces.apt.args.apt_command]
cmd_name = "apt"
arg_parser = "argparse"     # APT 使用 argparse 风格解析

# APT 全局帮助参数
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "help"
long_opt = "--help"
arg = "help"
is_flag = true

# APT 子命令 - search (搜索远程仓库)
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "search"
is_sub_cmd = true           # 表示这是一个子命令
arg = "targets"             # search 命令的参数
nargs = "*"

# APT 子命令 - list (列出包，支持本地搜索)
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "list"
is_sub_cmd = true
arg = "targets"             # list 命令的参数
nargs = "*"

[[action_interfaces.apt.args.apt_command.arg_parse.sub_args]]
name = "installed"
long_opt = "--installed"    # --installed 选项用于限制只显示已安装的包
arg = "installed_only"
is_flag = true

# APT 子命令 - install
[[action_interfaces.apt.args.apt_command.arg_parse]]
name = "install"
is_sub_cmd = true
arg = "targets"             # install 命令的参数
nargs = "*"

# === APT 动作触发规则 ===
[action_interfaces.apt.triggers.apt_command]
cmd_name = "apt"

# 全局帮助触发规则
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "help_operations"
condition = { params = [{ name = "help" }] }
trigger = [
    { params = [], action = "help" }
]

# 安装操作组
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "install_operations"
condition = { params = [{ name = "install", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "install", arg_map = { targets = "pkgs" } }  # apt install vim git → install action
]

# 远程搜索操作组 (apt search)
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "search_remote_operations"
condition = { params = [{ name = "search", is_sub_cmd = true }] }
trigger = [
    { params = [], action = "search_remote", arg_map = { targets = "pkgs" } }  # apt search vim → search_remote action
]

# 本地搜索操作组 (apt list --installed)
[[action_interfaces.apt.triggers.apt_command.rules]]
name = "search_local_operations"
condition = { params = [{ name = "list", is_sub_cmd = true }] }
trigger = [
    { params = [{ name = "installed" }], action = "search_local", arg_map = { targets = "pkgs" } },     # apt list --installed vim → search_local action
    { params = [], action = "list_installed" }                                                          # apt list --installed → list_installed action
]